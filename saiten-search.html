<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAG CoP — 採点規則検索</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f1c46">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAG CoP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="pwa.js" defer></script>
<script src="pdfview.js" defer></script>
<style>
  /* ===== 検索欄（スクロールしても上に残る） ===== */
  .search-zone{
    position:sticky;top:0;z-index:9;background:var(--bg);
    padding:12px 0 16px;display:flex;flex-direction:column;gap:16px;
  }
  .field-label{font-size:13px;font-weight:500;color:var(--txt-dim);letter-spacing:.1em;margin-bottom:-6px;}
  .field{position:relative;}
  .field svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--lime);fill:none;}
  input[type=search]{
    width:100%;font-family:var(--font-jp);font-size:19px;
    padding:18px 20px 18px 56px;border-radius:14px;
    border:2px solid var(--pill-line);background:var(--panel);color:var(--txt);outline:none;
    transition:border-color .15s;
  }
  input[type=search]::placeholder{color:var(--txt-mute);}
  input[type=search]:focus{border-color:var(--teal);}

  /* ===== 検索対象の切り替え ===== */
  .scope-tabs{display:flex;gap:10px;flex-wrap:wrap;}
  .scope-tabs button{
    font-family:var(--font-jp);font-size:14px;font-weight:500;cursor:pointer;
    padding:11px 22px;min-height:44px;border-radius:999px;
    border:1.5px solid var(--pill-line);background:transparent;color:var(--txt-soft);
    transition:border-color .15s,background .15s,color .15s;
  }
  .scope-tabs button:hover{border-color:var(--teal);color:var(--txt);}
  .scope-tabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700;}

  /* ===== 件数 ===== */
  .meta-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;min-height:28px;}
  .meta-row .count{font-size:14px;color:var(--txt-dim);}
  .meta-row .count strong{font-family:var(--font-en);font-size:22px;color:var(--lime);margin:0 2px;}
  .meta-row .scope{font-size:13px;color:var(--txt-faint);margin-left:auto;}

  /* ===== 結果 ===== */
  .results{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .results .sec-head{padding-top:12px;}
  .results .sec-head:not(:first-child){padding-top:24px;}
  .hit-link{
    display:grid;grid-template-columns:88px minmax(0,1fr) 48px;align-items:center;
    background:var(--panel);border-radius:14px;overflow:hidden;
    text-decoration:none;color:var(--txt);transition:background .15s;
  }
  .hit-link:hover{background:var(--panel-2);color:var(--txt);}
  .page-cell{
    align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:var(--panel-2);padding:18px 0;
  }
  .hit-link:hover .page-cell{background:#34316a;}
  .page-cell .lab{font-family:var(--font-en);font-size:10px;letter-spacing:.22em;color:var(--txt-faint);}
  .page-cell .num{font-family:var(--font-en);font-size:28px;font-weight:700;color:var(--teal);line-height:1;}
  .hit-link.jp .page-cell .num{color:var(--lime);}
  .hit-body{padding:18px 22px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .filename{font-family:var(--font-en);font-size:12px;color:var(--txt-dim);letter-spacing:.04em;overflow-wrap:anywhere;}
  .snippet{font-size:16px;line-height:1.75;}
  mark{background:var(--lime);color:var(--bg);padding:1px 5px;border-radius:4px;font-weight:700;}
  .go{width:20px;height:20px;stroke:var(--txt-mute);fill:none;justify-self:center;}
  .hit-link:hover .go{stroke:var(--lime);}

  @media(max-width:600px){
    .field-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
    input[type=search]{font-size:17px;padding:14px 14px 14px 46px;border-radius:12px;}
    .field svg{left:16px;width:20px;height:20px;}
    .scope-tabs{gap:8px;flex-wrap:nowrap;}
    .scope-tabs button{flex:1 1 0;padding:10px 4px;font-size:13px;}
    .scope-tabs .long{display:none;}
    .hit-link{grid-template-columns:62px minmax(0,1fr);border-radius:12px;}
    .page-cell{padding:14px 0;}
    .page-cell .lab{font-size:9px;}
    .page-cell .num{font-size:22px;}
    .hit-body{padding:12px 14px;gap:4px;}
    .filename{font-size:11px;}
    .snippet{font-size:14px;line-height:1.65;}
    .go{display:none;}
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="container">
    <div class="brand-row">
      <div class="brand"><b>MAG CoP</b><span>Code of Points Search</span></div>
      <span class="brand-meta">国際 ＋ 国内 · <span id="docCount">—</span> PDF</span>
    </div>
    <div class="title">
      <span class="kicker">体操競技男子</span>
      <h1>採点規則検索</h1>
    </div>
    <nav class="tabs" aria-label="ページ切り替え">
      <a href="saiten-search.html" data-nav aria-current="page">検索</a>
      <a href="pdf-list.html" data-nav>PDF<span class="long">一覧</span></a>
      <a href="videos.html" data-nav>動画</a>
      <a href="kitei.html" data-nav class="wide"><span class="long">小学生</span>規定演技</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="search-zone">
    <label class="field-label" for="q">キーワード検索</label>
    <div class="field">
      <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="q" placeholder="キーワードを入力（例：減点、加点、あん馬）" autocomplete="off" enterkeyhint="search" autofocus>
    </div>
    <div class="scope-tabs" id="scopeTabs" role="group" aria-label="検索対象">
      <button type="button" data-scope="intl" aria-pressed="true">国際<span class="long">ルール</span></button>
      <button type="button" data-scope="jp" aria-pressed="false">国内<span class="long">ルール</span></button>
      <button type="button" data-scope="both" aria-pressed="false">両方<span class="long">検索</span></button>
    </div>
    <div class="meta-row" aria-live="polite">
      <span class="count" id="count"></span>
      <span class="scope" id="scope"></span>
    </div>
  </div>

  <ul class="results" id="results"></ul>

  <footer class="site-foot">
    <span>検索は端末内で完結（外部送信なし）</span>
    <span>カードをタップで該当ページを開く（戻るで結果に戻る）</span>
  </footer>
</main>

<script>
/* 国際（index.json）と国内（index_jp.json）の2つのインデックスを読み込み、
   タブで検索対象を切り替える。
   ※ file:// 直開きは CORS 制限で fetch が失敗する。
     ローカル確認は `python3 -m http.server` 経由、本番は GitHub Pages で。 */
let INDEX_INTL = [];   // 国際ルール
let INDEX_JP   = [];   // 国内ルール
let SCOPE = 'intl';    // 'intl' | 'jp' | 'both'
const elQ=document.getElementById('q'),
      elR=document.getElementById('results'),
      elC=document.getElementById('count'),
      elS=document.getElementById('scope'),
      elDoc=document.getElementById('docCount');

const ICON_GO = `<svg class="go" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>`;
const NO_HIT  = `<li class="state"><div class="big">NO DATA</div>該当なし — 表記ゆれ（漢字／かな）や別の語を試してください</li>`;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tokens(q){return q.trim().split(/[\s　]+/).filter(Boolean);}
function highlight(text, terms){
  let html = esc(text);
  for(const t of terms){
    const re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    html = html.replace(re, m=>`<mark>${m}</mark>`);
  }
  return html;
}
function search(q){
  const terms = tokens(q);
  if(terms.length===0){ clearResults(); return; }
  const match = r => terms.every(t => r.text.includes(t) || r.file.includes(t));
  if(SCOPE==='both'){
    renderBoth(INDEX_INTL.filter(match), INDEX_JP.filter(match), terms);
  }else{
    const src = SCOPE==='jp' ? INDEX_JP : INDEX_INTL;
    render(src.filter(match), terms);
  }
}
function snippetFor(raw, terms){
  // 目次の点線リーダー（‥‥‥ や ・・・）を詰める
  const text = raw.replace(/[‥…・·\.．]{3,}/g, ' … ').replace(/\s{2,}/g, ' ');
  // 最初にヒットした語の位置
  let pos = -1, len = 0;
  for(const t of terms){ const i=text.indexOf(t); if(i>=0 && (pos<0||i<pos)){ pos=i; len=t.length; } }
  if(pos<0) return text.slice(0,80)+(text.length>80?'…':'');
  // ヒット語を含む「一文」（。等で区切る）
  const seps=['。','．','！','？'];
  let start=0;
  for(const sep of seps){ const i=text.lastIndexOf(sep,pos); if(i+1>start) start=i+1; }
  let end=text.length;
  for(const sep of seps){ const i=text.indexOf(sep,pos); if(i>=0 && i+1<end) end=i+1; }
  // 一文が長すぎるときはヒット語の前後だけを残す
  const MAX=90, BEFORE=30;
  if(end-start > MAX){
    const s = Math.max(start, pos-BEFORE);
    const e = Math.min(end, s+MAX, Math.max(pos+len, s+MAX));
    return (s>start?'…':'') + text.slice(s,e).trim() + (e<end?'…':'');
  }
  return text.slice(start,end).trim();
}
function hitHTML(h, terms){
  const name = h.file.split('/').pop();
  const jp = h.file.startsWith('pdfs_jp/') ? ' jp' : '';
  return `
    <li>
      <a class="hit-link${jp}" href="${esc(h.file)}#page=${h.page}" data-q="${esc(terms.join(' '))}" target="_blank" rel="noopener">
        <span class="page-cell">
          <span class="lab">PAGE</span>
          <span class="num">${String(h.page).padStart(2,'0')}</span>
        </span>
        <span class="hit-body">
          <span class="filename">${esc(name)}</span>
          <span class="snippet">${highlight(snippetFor(h.text, terms), terms)}</span>
        </span>
        ${ICON_GO}
      </a>
    </li>`;
}
function groupHead(tag, label, n, lime){
  return `<li class="sec-head"><span class="tag${lime?' lime':''}">${tag}</span><span class="label">${label}</span><span class="cnt">${n}件</span></li>`;
}
function clearResults(){
  elR.innerHTML=''; elC.innerHTML=''; elS.textContent='';
}
function render(hits, terms){
  elC.innerHTML = `<strong>${hits.length}</strong> 件ヒット`;
  elS.textContent = `「${terms.join(' / ')}」`;
  elR.innerHTML = hits.length ? hits.map(h=>hitHTML(h,terms)).join('') : NO_HIT;
}
function renderBoth(intl, jp, terms){
  elC.innerHTML = `国際 <strong>${intl.length}</strong> 件 ／ 国内 <strong>${jp.length}</strong> 件`;
  elS.textContent = `「${terms.join(' / ')}」`;
  if(intl.length===0 && jp.length===0){ elR.innerHTML = NO_HIT; return; }
  let html='';
  if(intl.length){ html += groupHead('INTERNATIONAL','国際ルール',intl.length,false) + intl.map(h=>hitHTML(h,terms)).join(''); }
  if(jp.length){ html += groupHead('DOMESTIC','国内ルール',jp.length,true) + jp.map(h=>hitHTML(h,terms)).join(''); }
  elR.innerHTML = html;
}
let timer;
elQ.addEventListener('input', e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value),110);});

// ===== 検索対象の切り替え =====
document.getElementById('scopeTabs').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  SCOPE = btn.dataset.scope;
  document.querySelectorAll('#scopeTabs button').forEach(b=>b.setAttribute('aria-pressed', b===btn ? 'true' : 'false'));
  search(elQ.value);   // キーワードを保ったまま再検索
  elQ.focus();
});

// 初期表示（読み込み中）
elQ.disabled = true;
elR.innerHTML = `<li class="state"><div class="big">· · ·</div>インデックスを読み込み中…</li>`;

// 国際・国内の両インデックスを並列で読み込む（片方失敗でも他方は使用可）
Promise.allSettled([
  fetch('index.json').then(r=>{ if(!r.ok) throw new Error('index.json: '+r.status); return r.json(); }),
  fetch('index_jp.json').then(r=>{ if(!r.ok) throw new Error('index_jp.json: '+r.status); return r.json(); }),
]).then(([intl, jp])=>{
  if(intl.status==='fulfilled') INDEX_INTL = intl.value;
  if(jp.status==='fulfilled')   INDEX_JP   = jp.value;
  if(INDEX_INTL.length===0 && INDEX_JP.length===0){
    elR.innerHTML = `<li class="state"><div class="big">LOAD ERROR</div>`+
      `インデックスを読み込めません<br>`+
      `<span class="accent">file:// 直開きは不可</span> — python3 -m http.server か GitHub Pages で開いてください</li>`;
    return;
  }
  elDoc.textContent = new Set([...INDEX_INTL, ...INDEX_JP].map(r=>r.file)).size;
  elQ.disabled = false;
  clearResults();
  elQ.focus();
});
</script>
</body>
</html>
