<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAG CoP — PDF一覧</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f1c46">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAG CoP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="pwa.js" defer></script>
<style>
  main.container{display:flex;flex-direction:column;gap:22px;}
  .sec-head.later{padding-top:22px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start;}
  .card{background:var(--panel);border-radius:14px;overflow:hidden;}
  .card.full{grid-column:1 / -1;}
  .card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--panel-2);}
  .card-head h3{margin:0;font-size:18px;font-weight:700;letter-spacing:.04em;}
  .card-head .en-label{margin-left:auto;font-family:var(--font-en);font-size:11px;letter-spacing:.2em;color:var(--txt-faint);text-transform:uppercase;}
  .card-head .jump{margin-left:auto;font-size:12px;text-decoration:none;}
  .docs{list-style:none;margin:0;padding:0;}
  .card.full .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
  .docs li + li{border-top:1px solid var(--line-soft);}
  .card.full .docs li{border-top:1px solid var(--line-soft);}
  .doc{display:flex;align-items:center;gap:14px;padding:15px 20px;min-height:44px;text-decoration:none;color:var(--txt);transition:background .12s;}
  .doc:hover{background:var(--panel-2);color:var(--txt);}
  .doc-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .doc-title{font-size:15px;}
  .doc-sub{font-size:12px;color:var(--txt-faint);}
  .doc-sub.video{color:var(--lime);}
  .doc-go{font-family:var(--font-en);font-size:12px;color:var(--txt-faint);letter-spacing:.1em;white-space:nowrap;}
  .doc:hover .doc-go{color:var(--lime);}
  .doc:hover .doc-ic{stroke:var(--lime);}
  @media(max-width:600px){
    .grid{grid-template-columns:1fr;}
    .card.full .docs{grid-template-columns:1fr;}
    .card-head .en-label{display:none;}
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="container">
    <div class="brand-row">
      <div class="brand"><b>MAG CoP</b><span>Code of Points Search</span></div>
      <span class="brand-meta">国際 ＋ 国内 · <span id="docCount">—</span> PDF</span>
    </div>
    <div class="title">
      <span class="kicker">体操競技男子</span>
      <h1>PDF一覧</h1>
    </div>
    <nav class="tabs" aria-label="ページ切り替え">
      <a href="saiten-search.html" data-nav>検索</a>
      <a href="pdf-list.html" data-nav aria-current="page">PDF<span class="long">一覧</span></a>
      <a href="videos.html" data-nav>動画</a>
      <a href="kitei.html" data-nav class="wide"><span class="long">小学生</span>規定演技</a>
    </nav>
  </div>
</header>

<main class="container">
  <h2 class="sec-head"><span class="tag">INTERNATIONAL</span><span class="label">国際ルール — FIG CoP 2025</span></h2>
  <div class="grid" id="intl"></div>

  <h2 class="sec-head later"><span class="tag lime">DOMESTIC</span><span class="label">国内ルール — 日本体操協会</span></h2>
  <div class="grid" id="jp"></div>

  <footer class="site-foot">
    <span>PDFは別タブで開きます</span>
    <span>差し替えは pdf-list.html の各配列を編集</span>
  </footer>
</main>

<script>
/* 種目ごとに分割した独立PDFを開く運用。
   file はこのHTMLからの相対パス。差し替えはこの配列を編集するだけ。 */
const APPARATUS = [
  {name:"ゆか", en:"Floor", docs:[
    {title:"ゆか 採点規則", sub:"第10章 · CoP 2025", file:"pdfs/FX_CoP_2025.pdf"},
  ]},
  {name:"あん馬", en:"Pommel", docs:[
    {title:"あん馬 採点規則", sub:"第11章 · CoP 2025", file:"pdfs/PH_CoP_2025.pdf"},
  ]},
  {name:"つり輪", en:"Rings", docs:[
    {title:"つり輪 採点規則", sub:"第12章 · CoP 2025", file:"pdfs/SR_CoP_2025.pdf"},
  ]},
  {name:"跳馬", en:"Vault", docs:[
    {title:"跳馬 採点規則", sub:"第13章 · CoP 2025", file:"pdfs/VT_CoP_2025.pdf"},
  ]},
  {name:"平行棒", en:"P-Bars", docs:[
    {title:"平行棒 採点規則", sub:"第14章 · CoP 2025", file:"pdfs/PB_CoP_2025.pdf"},
  ]},
  {name:"鉄棒", en:"High Bar", docs:[
    {title:"鉄棒 採点規則", sub:"第15章 · CoP 2025", file:"pdfs/HB_CoP_2025.pdf"},
  ]},
];

// 種目章以外の主要セクション（先頭に横長で表示）
const GENERAL = [
  {name:"一般・実施", en:"General", docs:[
    {title:"競技参加者規則・演技の評価", sub:"第1〜9章", file:"pdfs/GEN_CoP_2025.pdf"},
    {title:"補足説明および解釈", sub:"第4部 補足", file:"pdfs/SUP_CoP_2025.pdf"},
  ]},
];

/* ===== 国内ルール（日本体操協会 適用規則ほか） ===== */
const DOMESTIC = [
  {name:"年代別 適用規則", en:"Age Group", docs:[
    {title:"U-12 男子適用規則", sub:"2025年版", file:"pdfs_jp/JP_U12_rules_2025.pdf"},
    {title:"U-12 跳馬価値点一覧表", sub:"2025年版", file:"pdfs_jp/JP_U12_VT_values_2025.pdf"},
    {title:"U-15 男子適用規則", sub:"2025年版（2025.01更新）", file:"pdfs_jp/JP_U15_rules_2025.pdf"},
    {title:"U-15 跳馬価値点一覧表", sub:"2025年版", file:"pdfs_jp/JP_U15_VT_values_2025.pdf"},
    {title:"高等学校男子適用規則", sub:"2026年版", file:"pdfs_jp/JP_HS_rules_2026.pdf"},
    {title:"マスターズ適用規則", sub:"2025年4月更新版", file:"pdfs_jp/JP_Masters_rules_2025.pdf"},
  ]},
  {name:"情報33号 · 規則修正", en:"Info 33", docs:[
    {title:"採点規則修正・追加情報", sub:"FIG NL反映 2025年版", file:"pdfs_jp/JP_Info33_01_kaitei.pdf"},
    {title:"タイ・ブレイクについて", sub:"FIG TR 2026 抜粋", file:"pdfs_jp/JP_Info33_08_tiebreak.pdf"},
    {title:"2026年度 国内内規", sub:"国内対応", file:"pdfs_jp/JP_Info33_09_naiki.pdf"},
    {title:"マナー・モラルについて", sub:"競技会運営", file:"pdfs_jp/JP_Info33_10_manner.pdf"},
  ]},
  {name:"情報33号 · 種目別確認事項", en:"Info 33", docs:[
    {title:"ゆか 確認事項・FIG通達", sub:"動画リンクあり", video:true, file:"pdfs_jp/JP_Info33_02_FX.pdf"},
    {title:"あん馬 確認事項・FIG通達", sub:"動画リンクあり", video:true, file:"pdfs_jp/JP_Info33_03_PH.pdf"},
    {title:"つり輪 確認事項・FIG通達", sub:"動画リンクあり", video:true, file:"pdfs_jp/JP_Info33_04_SR.pdf"},
    {title:"跳馬 確認事項", sub:"情報33号", file:"pdfs_jp/JP_Info33_05_VT.pdf"},
    {title:"平行棒 確認事項・FIG通達", sub:"動画リンクあり", video:true, file:"pdfs_jp/JP_Info33_06_PB.pdf"},
    {title:"鉄棒 確認事項・FIG通達", sub:"動画リンクあり", video:true, file:"pdfs_jp/JP_Info33_07_HB.pdf"},
  ]},
  {name:"小学生規定演技", en:"Compulsory 2022", jump:"kitei.html", docs:[
    {title:"総則（採点・器械器具・発刊によせて）", sub:"2022年度版 小学生適用", file:"pdfs_jp/JP_Kitei2022_00_general.pdf"},
    {title:"ゆか 規定演技", sub:"解説・減点表", file:"pdfs_jp/JP_Kitei2022_FX.pdf"},
    {title:"あん馬 規定演技（規定１・２）", sub:"解説・減点表", file:"pdfs_jp/JP_Kitei2022_PH.pdf"},
    {title:"つり輪 規定演技", sub:"解説・減点表", file:"pdfs_jp/JP_Kitei2022_SR.pdf"},
    {title:"跳馬 規定演技", sub:"解説・減点表", file:"pdfs_jp/JP_Kitei2022_VT.pdf"},
    {title:"平行棒 規定演技", sub:"解説・減点表", file:"pdfs_jp/JP_Kitei2022_PB.pdf"},
    {title:"鉄棒 規定演技", sub:"解説・減点表", file:"pdfs_jp/JP_Kitei2022_HB.pdf"},
  ]},
];

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const fileIcon=`<svg class="doc-ic" viewBox="0 0 24 24" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/></svg>`;

function card(sec, badge, opt){
  opt = opt || {};
  const docs = sec.docs.map(d=>`
    <li><a class="doc" href="${esc(d.file)}" target="_blank" rel="noopener">
      ${fileIcon}
      <span class="doc-text"><span class="doc-title">${esc(d.title)}</span><span class="doc-sub${d.video?' video':''}">${esc(d.sub||'')}</span></span>
      <span class="doc-go">開く ↗</span>
    </a></li>`).join('');
  const right = sec.jump
    ? `<a class="jump" href="${esc(sec.jump)}" data-nav>動画付きページへ →</a>`
    : `<span class="en-label">${esc(sec.en)}</span>`;
  return `
    <section class="card${opt.full?' full':''}">
      <div class="card-head">
        <span class="badge${opt.teal?' teal':''}${badge==='JP'?' sm':''}">${esc(badge)}</span>
        <h3>${esc(sec.name)}</h3>
        ${right}
      </div>
      <ul class="docs">${docs}</ul>
    </section>`;
}

document.getElementById('intl').innerHTML =
  GENERAL.map(s=>card(s,'§',{teal:true,full:true})).join('') +
  APPARATUS.map((s,i)=>card(s,String(i+1).padStart(2,'0'))).join('');
document.getElementById('jp').innerHTML =
  DOMESTIC.map(s=>card(s,'JP',{teal:true})).join('');

const total = [...GENERAL,...APPARATUS,...DOMESTIC].reduce((n,s)=>n+s.docs.length,0);
document.getElementById('docCount').textContent = total;
</script>
</body>
</html>
