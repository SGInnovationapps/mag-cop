<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAG CoP — 小学生規定演技</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f1c46">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAG CoP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="pwa.js" defer></script>
<style>
  main.container{display:flex;flex-direction:column;gap:30px;}

  /* ===== 総則リンク ===== */
  .general{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    background:var(--panel);border-radius:14px;padding:20px 24px;
    text-decoration:none;color:var(--txt);transition:background .15s;
  }
  .general:hover{background:var(--panel-2);color:var(--txt);}
  .general .badge{width:36px;height:36px;flex-basis:36px;border-radius:9px;}
  .general .t{display:flex;flex-direction:column;gap:3px;flex:1;min-width:220px;}
  .general .t b{font-size:17px;}
  .general .t span{font-size:13px;color:var(--txt-faint);}
  .general .go{font-family:var(--font-en);font-size:13px;color:var(--teal);letter-spacing:.1em;}
  .general:hover .go{color:var(--lime);}

  /* ===== 種目ブロック ===== */
  .app{display:flex;flex-direction:column;gap:16px;}
  .app .sec-head .label{font-size:22px;}
  .app .sec-head .en-label{font-family:var(--font-en);font-size:11px;letter-spacing:.22em;color:var(--txt-faint);}
  .app-body{display:flex;gap:18px;flex-wrap:wrap;align-items:stretch;}
  .vbox{flex:3 1 460px;min-width:0;background:var(--panel);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .vbox video{display:block;width:100%;aspect-ratio:16/9;background:#100e2a;}
  .vmissing{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#100e2a;color:var(--txt-faint);font-size:14px;letter-spacing:.06em;}
  .vcap{padding:14px 18px;font-size:13px;color:var(--txt-dim);}
  .side{flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:12px;}
  .pdf{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;padding:18px 20px;min-height:44px;text-decoration:none;color:var(--txt);transition:background .15s;}
  .pdf:hover{background:var(--panel-2);color:var(--txt);}
  .pdf .doc-ic{width:20px;height:22px;flex-basis:20px;}
  .pdf .t{display:flex;flex-direction:column;gap:3px;flex:1;}
  .pdf .t b{font-size:15px;}
  .pdf .t span{font-size:12px;color:var(--txt-faint);}
  .pdf .go{font-family:var(--font-en);font-size:12px;color:var(--txt-faint);}
  .pdf:hover .go,.pdf:hover .doc-ic{color:var(--lime);stroke:var(--lime);}
  .points{background:var(--header);border:1px solid var(--line-soft);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .points .lab{font-family:var(--font-en);font-size:11px;letter-spacing:.22em;color:var(--txt-faint);}
  .points .row{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--txt-soft);}
  .points .row strong{font-family:var(--font-en);font-size:22px;color:var(--txt);margin-left:4px;}
  .points .row strong.lime{color:var(--lime);}
  .points .note{font-size:12px;color:var(--txt-faint);line-height:1.7;}

  @media(max-width:600px){
    main.container{gap:24px;}
    .general{padding:16px 18px;gap:14px;}
    .app .sec-head .label{font-size:19px;}
    .app .sec-head .en-label{display:none;}
    .vbox,.side{flex-basis:100%;}
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="container">
    <div class="brand-row">
      <div class="brand"><b>MAG CoP</b><span>Code of Points Search</span></div>
      <span class="brand-meta">2022年度版 小学生適用</span>
    </div>
    <div class="title">
      <span class="kicker">体操競技男子</span>
      <h1>小学生規定演技</h1>
    </div>
    <nav class="tabs" aria-label="ページ切り替え">
      <a href="saiten-search.html" data-nav>検索</a>
      <a href="pdf-list.html" data-nav>PDF<span class="long">一覧</span></a>
      <a href="videos.html" data-nav>動画</a>
      <a href="kitei.html" data-nav class="wide" aria-current="page"><span class="long">小学生</span>規定演技</a>
    </nav>
  </div>
</header>

<main class="container">
  <a class="general" href="pdfs_jp/JP_Kitei2022_00_general.pdf" target="_blank" rel="noopener">
    <span class="badge">§</span>
    <span class="t"><b>総則 — 演技の採点・器械器具の寸度</b><span>改定のねらい・発刊によせて を含む</span></span>
    <span class="go">PDFを開く ↗</span>
  </a>

  <div id="sections" style="display:flex;flex-direction:column;gap:34px"></div>

  <footer class="site-foot">
    <span>出典：体操競技男子 ジュニア規定演技 2022年度版 小学生適用（公益財団法人 日本体操協会）</span>
  </footer>
</main>

<script>
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const fileIcon=`<svg class="doc-ic" viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/></svg>`;

/* 種目 → PDF・動画・配点メモ。動画は videos_local/ に置いたMP4を参照。
   ファイルを差し替えるだけで更新できる。note は規定演技PDFの記載から抜粋。 */
const APPARATUS = [
  {name:"ゆか",   en:"Floor",    pdf:"pdfs_jp/JP_Kitei2022_FX.pdf", video:"videos_local/kitei2022_FX.mp4", sub:"解説・減点表",
   note:"演技時間は75秒以内。演技時間の超過（76秒以上）は0.3の減点。"},
  {name:"あん馬", en:"Pommel",   pdf:"pdfs_jp/JP_Kitei2022_PH.pdf", video:"videos_local/kitei2022_PH.mp4", sub:"規定１・規定２ · 解説・減点表",
   note:"規定１は両把手上 横向き旋回10回、規定２は把手なしあん馬で実施。"},
  {name:"つり輪", en:"Rings",    pdf:"pdfs_jp/JP_Kitei2022_SR.pdf", video:"videos_local/kitei2022_SR.mp4", sub:"解説・減点表",
   note:"区分Ⅰの前振り出し以外、原則として演技は伸腕で行う。"},
  {name:"跳馬",   en:"Vault",    pdf:"pdfs_jp/JP_Kitei2022_VT.pdf", video:"videos_local/kitei2022_VT.mp4", sub:"前転とび · 解説・減点表",
   note:"前転とびを2跳越し、その平均点を決定点とする。ライン減点は設定しない。"},
  {name:"平行棒", en:"P-Bars",   pdf:"pdfs_jp/JP_Kitei2022_PB.pdf", video:"videos_local/kitei2022_PB.mp4", sub:"解説・減点表",
   note:"静止技で静止時間が2秒未満は各々0.3、静止が見られない場合は各々0.5の減点。"},
  {name:"鉄棒",   en:"High Bar", pdf:"pdfs_jp/JP_Kitei2022_HB.pdf", video:"videos_local/kitei2022_HB.mp4", sub:"解説・減点表",
   note:"車輪の過不足は、超過が毎回0.3、不足が毎回1.0の減点。"},
];

const el = document.getElementById('sections');
el.innerHTML = APPARATUS.map((a,i)=>`
  <section class="app">
    <h2 class="sec-head">
      <span class="badge teal">${String(i+1).padStart(2,'0')}</span>
      <span class="label">${esc(a.name)}</span>
      <span class="en-label">${esc(a.en.toUpperCase())}</span>
    </h2>
    <div class="app-body">
      <div class="vbox">
        <video controls preload="metadata" playsinline src="${esc(a.video)}#t=0.1"></video>
        <div class="vcap">2022年度版 小学生適用 規定演技 ${esc(a.name)}</div>
      </div>
      <div class="side">
        <a class="pdf" href="${esc(a.pdf)}" target="_blank" rel="noopener">
          ${fileIcon}
          <span class="t"><b>${esc(a.name)} 規定演技</b><span>${esc(a.sub)}</span></span>
          <span class="go">↗</span>
        </a>
        <div class="points">
          <span class="lab">配点</span>
          <div class="row"><span>実施<strong>9.5</strong></span><span>加点<strong class="lime">0.5</strong></span></div>
          <span class="note">${esc(a.note)}</span>
        </div>
      </div>
    </div>
  </section>`).join('');

// 動画が読み込めない場合は「準備中」表示に差し替え
el.querySelectorAll('video').forEach(v=>{
  v.addEventListener('error', ()=>{
    const d = document.createElement('div');
    d.className = 'vmissing';
    d.textContent = '動画は準備中です';
    v.replaceWith(d);
  });
});
</script>
</body>
</html>
