<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MAG CoP — 動画一覧</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f1c46">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAG CoP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="pwa.js" defer></script>
<script src="pdfview.js" defer></script>
<style>
  main.container{display:flex;flex-direction:column;gap:22px;}

  /* ===== 種目フィルタ ===== */
  .filters{display:flex;gap:10px;flex-wrap:wrap;}
  .filters button{
    font-family:var(--font-jp);font-size:14px;font-weight:500;cursor:pointer;
    display:flex;align-items:center;gap:8px;
    padding:11px 20px;min-height:44px;border-radius:999px;
    border:1.5px solid var(--pill-line);background:transparent;color:var(--txt-soft);
    transition:border-color .15s,background .15s,color .15s;
  }
  .filters button:hover{border-color:var(--teal);color:var(--txt);}
  .filters button .n{font-family:var(--font-en);color:var(--lime);}
  .filters button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:700;}
  .filters button[aria-pressed="true"] .n{color:var(--bg);}

  /* ===== 動画カード ===== */
  .group{display:flex;flex-direction:column;gap:16px;padding-top:14px;}
  .group[hidden]{display:none;}
  .group .sec-head .label{font-size:20px;}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  .vcard{background:var(--panel);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .thumb{position:relative;display:block;aspect-ratio:16/9;background:var(--panel-2);overflow:hidden;}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .play{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:56px;height:56px;border-radius:50%;background:var(--lime);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(23,21,58,.45);transition:transform .15s;
  }
  .thumb .play svg{width:22px;height:22px;margin-left:3px;fill:var(--bg);}
  .thumb:hover .play{transform:translate(-50%,-50%) scale(1.08);}
  .vmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;}
  .vtitle{font-size:15px;font-weight:700;color:var(--txt);text-decoration:none;}
  .vtitle:hover{color:var(--lime);}
  .vsrc{font-family:var(--font-en);font-size:12px;color:var(--txt-faint);}
  .vsrcbadge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--pill-line);color:var(--txt-dim);}
  .vsrcbadge.new{border-color:var(--lime);color:var(--lime);}
  .vsrc a{color:var(--txt-dim);}
  .vsrc a:hover{color:var(--lime);}

  @media(max-width:600px){
    .filters{gap:8px;}
    .filters button{padding:9px 14px;font-size:13px;}
    .vgrid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="container">
    <div class="brand-row">
      <div class="brand"><b>MAG CoP</b><span>Code of Points Search</span></div>
      <span class="brand-meta">情報33号 ＋ FIGニュースレター · <span id="vidCount">—</span>本</span>
    </div>
    <div class="title">
      <span class="kicker">体操競技男子</span>
      <h1>動画一覧</h1>
    </div>
    <nav class="tabs" aria-label="ページ切り替え">
      <a href="saiten-search.html" data-nav>検索</a>
      <a href="pdf-list.html" data-nav>PDF<span class="long">一覧</span></a>
      <a href="videos.html" data-nav aria-current="page">動画</a>
      <a href="kitei.html" data-nav class="wide"><span class="long">小学生</span>規定演技</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="filters" id="filters" role="group" aria-label="種目で絞り込み"></div>

  <div id="list"><div class="state"><div class="big">· · ·</div>動画リストを読み込み中…</div></div>

  <footer class="site-foot">
    <span>出典：男子体操競技情報33号、FIGニュースレター No.4 国内適用（日本体操協会）</span>
    <span>サムネイルをタップでYouTube再生</span>
  </footer>
</main>

<script>
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function ytid(url){
  const m = url.match(/[?&]v=([\w-]{6,})/) || url.match(/youtu\.be\/([\w-]{6,})/);
  return m ? m[1] : null;
}
const ORDER = ['ゆか','あん馬','つり輪','跳馬','平行棒','鉄棒',
               '採点規則修正・追加情報','タイ・ブレイク','2026年度国内内規','マナー・モラル'];
const PLAY = `<span class="play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></span>`;

fetch('videos.json')
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(videos=>{
    document.getElementById('vidCount').textContent = videos.length;
    const groups = new Map();
    for(const v of videos){
      if(!groups.has(v.apparatus)) groups.set(v.apparatus, []);
      groups.get(v.apparatus).push(v);
    }
    const keys = [...groups.keys()].sort((a,b)=>{
      const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib);
    });

    // 種目フィルタ
    document.getElementById('filters').innerHTML =
      `<button type="button" data-k="" aria-pressed="true">すべて</button>` +
      keys.map(k=>`<button type="button" data-k="${esc(k)}" aria-pressed="false">${esc(k)} <span class="n">${groups.get(k).length}</span></button>`).join('');

    // 種目ごとのカード
    document.getElementById('list').innerHTML = keys.map(k=>{
      const vs = groups.get(k);
      const seq = {};
      const cards = vs.map(v=>{
        const id = ytid(v.url);
        seq[v.source] = (seq[v.source]||0) + 1;
        const label = v.title || `${k} · 動画 ${String(seq[v.source]).padStart(2,'0')}`;
        const isNew = v.source !== '情報33号';
        const img = id ? `<img src="https://img.youtube.com/vi/${esc(id)}/mqdefault.jpg" alt="" loading="lazy">` : '';
        return `
          <article class="vcard">
            <a class="thumb" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="${esc(label)}を再生">${img}${PLAY}</a>
            <div class="vmeta">
              <span class="vsrcbadge${isNew?' new':''}">${esc(v.source||'情報33号')}</span>
              <a class="vtitle" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(label)}</a>
              <span class="vsrc">出典: <a href="${esc(v.file)}#page=${v.page}" target="_blank" rel="noopener">${esc(v.file.split('/').pop())} p.${v.page}</a></span>
            </div>
          </article>`;
      }).join('');
      return `
        <section class="group" data-k="${esc(k)}">
          <h2 class="sec-head"><span class="label">${esc(k)}</span><span class="cnt">${vs.length}本</span></h2>
          <div class="vgrid">${cards}</div>
        </section>`;
    }).join('');

    document.getElementById('filters').addEventListener('click', e=>{
      const btn = e.target.closest('button'); if(!btn) return;
      const k = btn.dataset.k;
      document.querySelectorAll('#filters button').forEach(b=>b.setAttribute('aria-pressed', b===btn?'true':'false'));
      document.querySelectorAll('#list .group').forEach(g=>{ g.hidden = !!k && g.dataset.k !== k; });
    });
  })
  .catch(err=>{
    document.getElementById('list').innerHTML =
      `<div class="state"><div class="big">LOAD ERROR</div>`+
      `videos.json を読み込めません（${esc(err.message)}）<br>`+
      `<span class="accent">file:// 直開きは不可</span> — python3 -m http.server か GitHub Pages で開いてください</div>`;
  });
</script>
</body>
</html>
